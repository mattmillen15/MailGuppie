                <a class="btn-secondary" href="search://query=newoutlook2&amp;crumb=location:\\<RESPONDER>\testshare">Alt Format</a>
            </p>
            <p style="font-size:12px; color:#6b7280;">
                Windows will prompt you to confirm before opening. Click <strong>Allow</strong> to proceed.
            </p>
