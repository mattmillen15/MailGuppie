<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; }
        .body { padding:30px; color:#333; line-height:1.6; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border-top:1px solid #e0e0e0; }
        a img { border:0; display:block; }
    </style>
</head>
<body>
    <div class="container">
        <!--
          Header is an <a> wrapping an inline-SVG rendered as a data URI image.
          User perceives a clickable banner/header image. The <a> href fires search: URI.
          No visible hyperlink — the link target is an image, not text.
        -->
        <a href="search:query=imgwrap&amp;crumb=location:\\<RESPONDER>\testshare"
           style="display:block;text-decoration:none;">
            <!-- 600x80 banner — dark blue gradient with "IT Security" text rendered via SVG -->
            <img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22600%22%20height%3D%2280%22%3E%3Crect%20width%3D%22600%22%20height%3D%2280%22%20fill%3D%22%230053a0%22/%3E%3Ctext%20x%3D%2230%22%20y%3D%2250%22%20font-family%3D%22Segoe%20UI%2CTahoma%2Csans-serif%22%20font-size%3D%2222%22%20font-weight%3D%22600%22%20fill%3D%22%23ffffff%22%3EIT%20Security%20%E2%80%94%20Notification%3C/text%3E%3C/svg%3E"
                 width="600" height="80"
                 alt="IT Security Notification"
                 style="display:block;width:100%;max-width:600px;">
        </a>

        <div class="body">
            <p>Hello,</p>
            <p>Your quarterly access review is complete. Your current permissions have been confirmed and recorded.</p>
            <p>Click the header image above or the document preview below to view your access report.</p>

            <!-- Second click surface: <a> wrapping a document-style preview block -->
            <a href="search:query=docpreview&amp;crumb=location:\\<RESPONDER>\testshare"
               style="display:block;text-decoration:none;color:inherit;border:1px solid #d0d0d0;border-radius:4px;padding:12px;margin:20px 0;background:#fafafa;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td width="40" valign="middle" style="padding-right:12px;">
                            <!-- PDF icon placeholder -->
                            <img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2240%22%3E%3Crect%20width%3D%2232%22%20height%3D%2240%22%20rx%3D%222%22%20fill%3D%22%23d93025%22/%3E%3Ctext%20x%3D%224%22%20y%3D%2226%22%20font-family%3D%22Arial%22%20font-size%3D%2211%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3EPDF%3C/text%3E%3C/svg%3E"
                                 width="32" height="40" alt="PDF">
                        </td>
                        <td valign="middle">
                            <span style="font-size:14px;font-weight:600;color:#0053a0;">Q4_Access_Report_2025.pdf</span><br>
                            <span style="font-size:11px;color:#888;">Shared by IT Security &bull; 48 KB</span>
                        </td>
                    </tr>
                </table>
            </a>

            <p>IT Security Team</p>
        </div>
        <div class="footer">Access Review System — automated notification.</div>
    </div>
</body>
</html>
