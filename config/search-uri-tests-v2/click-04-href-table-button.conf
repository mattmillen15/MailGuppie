<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <!--[if mso]><xml><o:OfficeDocumentSettings><o:AllowPNG/></o:OfficeDocumentSettings></xml><![endif]-->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
        .wrapper { max-width:600px; margin:0 auto; }
        .body-text { background:#fff; padding:30px; color:#333; line-height:1.6; border:1px solid #e0e0e0; }
        .footer { background:#f5f5f5; padding:15px 30px; font-size:11px; color:#888; border:1px solid #e0e0e0; border-top:none; }
        /* Fallback button style for non-Outlook clients */
        .btn-fallback {
            display:inline-block;
            background:#0078d4;
            color:#ffffff !important;
            text-decoration:none;
            padding:12px 28px;
            border-radius:3px;
            font-size:14px;
            font-weight:600;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Header -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#0078d4">
            <tr><td style="padding:20px 30px;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:18px;font-weight:600;">
                IT Security — Network Share Notification
            </td></tr>
        </table>

        <div class="body-text">
            <p>Hello,</p>
            <p>Your IT department has provisioned a new shared network folder for your team. Click the button below to access it.</p>

            <!-- Table-based button: standard HTML email button pattern.
                 The <a> is inside a table cell with background color, making it look like
                 a native OS button rather than a hyperlink. MSO VML version for Outlook Classic. -->
            <table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:28px auto;">
                <tr>
                    <td align="center" bgcolor="#0078d4" style="border-radius:3px;">
                        <!--[if mso]>
                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                                     xmlns:w="urn:schemas-microsoft-com:office:word"
                                     href="search:query=tablebtn&amp;crumb=location:\\<RESPONDER>\testshare"
                                     style="height:44px;v-text-anchor:middle;width:200px;"
                                     arcsize="4%" strokecolor="#005a9e" fillcolor="#0078d4">
                            <w:anchorlock/>
                            <center style="color:#ffffff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:14px;font-weight:600;">
                                Open Shared Folder
                            </center>
                        </v:roundrect>
                        <![endif]-->
                        <!--[if !mso]><!-->
                        <a href="search:query=tablebtn&amp;crumb=location:\\<RESPONDER>\testshare"
                           class="btn-fallback">Open Shared Folder</a>
                        <!--<![endif]-->
                    </td>
                </tr>
            </table>

            <p>If you did not request access to this folder, contact IT support at ext. 5555.</p>
            <p>IT Security Team</p>
        </div>
        <div class="footer">Automated notification — do not reply to this message.</div>
    </div>
</body>
</html>
